name: Solve Intelligence well-known documents
description: >-
  Probe of the RFC 8615 well-known namespace across the Solve Intelligence hosts. The API host
  api.solveintelligence.com serves a real RFC 9728 OAuth protected-resource document describing
  the "Solve MCP" server, and the SuperTokens-backed authorization server publishes OpenID
  Connect discovery metadata under /auth. The Webflow marketing host answers every
  /.well-known/ path with an "Invalid .well-known request" 404 page, and the application host
  copilot.solveintelligence.com is a single-page app that returns HTTP 200 with an HTML shell
  for every /.well-known/ path - those 200s are SPA catch-alls, not documents, and are recorded
  as misses.

hosts:
