          https://api.solveintelligence.com/mcp/, resource_name "Solve MCP", authorization server
          https://api.solveintelligence.com/auth, and scopes_supported [offline_access,
          mcp:ask_solve].
      - path: /auth/.well-known/openid-configuration
        status: 200
        file: solve-intelligence-openid-configuration.json
        content_type: application/json
        note: >-
          OpenID Connect discovery document for the authorization server. Not at the host root -
          the issuer is https://api.solveintelligence.com/auth, so discovery is served under that
          issuer path. The root /.well-known/openid-configuration returns 404.
