    note: >-
      Primary API host. Serves the MCP server and its OAuth authorization server. Runs FastAPI
      behind nginx (identified from the Content-Security-Policy header, which references
      fastapi.tiangolo.com and swagger-ui-dist) with SuperTokens for identity.
    documents:
