apis:
- name: Solve MCP
  description: >-
    Solve Intelligence's first-party remote Model Context Protocol server. A streamable-HTTP MCP
    endpoint, authorized with OAuth against the company's own authorization server, that exposes
    patent and non-patent literature search, jurisdictional legal-text and case-law search, and
    SEP standard documentation search to MCP clients such as Claude, Claude Code, Codex, Cursor
    and VS Code. Requires an active Solve Intelligence subscription and must be enabled by a
    Solve organization administrator.
  humanURL: https://www.solveintelligence.com/blog/post/solve-intelligence-mcp-server-now-available-in-claude-2
