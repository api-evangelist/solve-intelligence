aid: solve-intelligence
name: Solve Intelligence
description: >-
  Solve Intelligence builds AI-native software for patent attorneys and intellectual property
  teams. Its Patent Copilot is an in-browser document editor, comparable to a word processor,
  with an AI assistant purpose-built for the patent lifecycle: application drafting, claim
  drafting, office action response and prosecution, invention harvesting and disclosure
  enhancement, claim and invalidity charting, prior-art and freedom-to-operate searching,
  infringement and validity analysis, standard-essential patent mapping, patent translation and
  proofreading. The company was founded by patent attorneys, AI researchers and software
  engineers, is used by hundreds of law firms and in-house IP teams across six continents, and
  has raised roughly $55M from Y Combinator, Microsoft, Thomson Reuters, 20VC, Operator
  Collective and Visionaries. Its public machine-readable surface is a first-party remote Model
  Context Protocol server, "Solve MCP", which brings global patent literature, non-patent
  literature, jurisdictional legal texts and case law, and SEP standard documentation into an
  agent session for subscribers.
