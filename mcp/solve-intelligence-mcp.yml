name: Solve MCP
description: >-
  Solve Intelligence publishes a first-party remote MCP server that exposes a slice of its
  Patent Copilot research surface to MCP clients. It is the only machine-callable API surface
  the company publishes to the open internet. The server brings global patent literature,
  non-patent literature (papers, books, theses, datasets, journals), patent legal texts and
  case law across the US, Europe, Japan and Australia, and SEP technical standard
  documentation into an agent session.

